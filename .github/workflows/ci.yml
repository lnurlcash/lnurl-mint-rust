name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # formatting and lint for every language in the repo: Rust, the e2e tests'
  # Python, and the admin UI's JavaScript/CSS
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # clippy compiles, and lnurlcash-kernel compiles Bitcoin Core's kernel
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake libboost-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings

      - uses: astral-sh/setup-uv@v7
      - run: uvx ruff@0.16.10 check e2e
      - run: uvx ruff@0.16.10 format --check e2e

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci --prefix e2e
      - run: e2e/node_modules/.bin/biome ci

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake libboost-dev
      - uses: dtolnay/rust-toolchain@stable
      # the kernel build takes minutes; keep it between runs
      - uses: Swatinem/rust-cache@v2
      - run: cargo test

  # real bitcoind, real LDK nodes, real payments: mint, melt, restarts,
  # crashes; lnurlcash-conformance's grader against the live mint; and the
  # admin web UI in a headless browser
  e2e:
    runs-on: ubuntu-latest
    env:
      BITCOIN_VERSION: "31.1"
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake libboost-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --features test-lsp
      - name: Fetch Bitcoin Core
        run: |
          base=https://bitcoincore.org/bin/bitcoin-core-$BITCOIN_VERSION
          file=bitcoin-$BITCOIN_VERSION-x86_64-linux-gnu.tar.gz
          curl -sfLO $base/$file
          curl -sfLO $base/SHA256SUMS
          grep " $file\$" SHA256SUMS | sha256sum -c -
          tar xzf $file
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci --prefix e2e
      - run: npx --prefix e2e playwright install --with-deps chromium
      - run: python3 e2e/regtest.py
        env:
          BITCOIN_BIN: bitcoin-${{ env.BITCOIN_VERSION }}/bin
          MINT_BIN: target/debug/lnurl-mint
          CONFORM: "1"
          UI: "1"
          UI_SCREENSHOTS: e2e-screenshots
          # electrs 0.10.10, pinned by digest: mint E syncs from it alone
          ELECTRS: docker:getumbrel/electrs@sha256:c991fd3d8b19614fa7309525e8ccb6c0a87464f8bf6bd4dff1479b493f7308f2
          KEEP: "1"
      # the mints' logs and the UI's screenshots, when something fails
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-logs
          path: |
            /tmp/lnurl-mint-e2e-*
            e2e-screenshots
          if-no-files-found: ignore

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: lnurl-mint:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # without bitcoind the image still serves, and says why it can't mint
      - name: Smoke test
        run: |
          docker run -d --name mint -p 8111:8111 -e BASE_URL=http://localhost:8111 lnurl-mint:ci
          for i in $(seq 30); do curl -sf localhost:8111/.well-known/lnurlp/_ && break; sleep 1; done
          curl -sf localhost:8111/.well-known/lnurlp/_ | grep withdrawLink
          curl -sf "localhost:8111/p/cb?amount=50000&comment=$(printf '0%.0s' {1..64})" | grep 'temporarily unavailable'
          docker stop -t 60 mint

  # the package (whose build runs cargo test), the module, and a NixOS VM
  # running bitcoind on regtest with the mint as its own node
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - run: nix flake check -L

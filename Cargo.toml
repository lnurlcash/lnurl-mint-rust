[package]
name = "lnurl-mint"
# placeholder: release.yml stamps the version from the git tag at release time
version = "0.0.0"
edition = "2024"
rust-version = "1.87.0"
description = "LNURLcash mint (LUD-25 bearer notes, LUD-26 derivation and Lightning Address) that is its own Lightning node, on LDK and BDK"
license = "MIT"

[[bin]]
name = "lnurl-mint"
path = "src/main.rs"

[features]
# a Lightning Service Provider for the regtest end-to-end test (TEST_LSP=1):
# never in a release build
test-lsp = []

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
env_logger = "0.11"
log = "0.4"

# The node: ldk-node (LDK 0.2 and BDK, chain sync, gossip, LSPS2 liquidity).
# Its bitcoin, lightning and lightning-invoice are re-exported and used from
# there, so the versions always agree.
ldk-node = "0.7"

lnurlcash-core = "0.2.3"
# Bitcoin Core's script interpreter, built from source and linked statically
lnurlcash-kernel = "0.2.3"
# the versions lnurlcash-core uses. LDK brings its own secp256k1 0.29: the two
# meet only as byte arrays.
secp256k1 = "0.33"
bech32 = "0.12"

hex = "0.4"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rand = "0.9"
# the version ldk-node bundles: two libsqlite3-sys cannot link into one binary
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
url = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.optimized]
inherits = "release"
panic = "abort"
strip = true
codegen-units = 1
lto = "fat"
debug = false
